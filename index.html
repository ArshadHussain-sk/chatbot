<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsh - Medical AI Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="chat-app" class="app-container">
        <header class="app-header glass-effect">
            <div class="header-info">
                <div class="avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                    </svg>
                </div>
                <div class="title-container">
                    <h1>Arsh</h1>
                    <span class="status"><span class="status-dot"></span> Online - Medical AI</span>
                </div>
            </div>

        </header>

        <main id="chat-container">
            <!-- Messages will be injected here -->
            <div class="message model">
                <div class="message-bubble glass-effect">
                    Hello! I am Arsh, your medical AI chatbot. How can I help you with your health today? Please note that I can only answer medical-related questions.
                </div>
            </div>
        </main>

        <div class="input-area glass-effect">
            <input type="text" id="message-input" placeholder="Type your medical question here..." autocomplete="off" autofocus>
            <button id="send-btn" class="primary-btn icon-only">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
